<script>
(function() {
    // Suppress WASM/game errors silently
    window.addEventListener('error', function(e) {
        if (e.message && (e.message.indexOf('responseType') !== -1 || e.message.indexOf('InvalidAccessError') !== -1)) {
            e.preventDefault();
            e.stopPropagation();
            return true;
        }
    }, true);

    window.addEventListener('unhandledrejection', function(e) {
        e.preventDefault();
    });

    // Block ALL sitelock redirects first (before anything else)
    var _origOpen = window.open;
    window.open = function(url) {
        if (url && url.toString().indexOf('sitelock') !== -1) {
            console.log('[Proxy] Blocked sitelock popup:', url);
            return null;
        }
        return _origOpen.apply(this, arguments);
    };

    // Store original location methods before any overrides
    var _realLocation = window.location;
    var _origAssign = _realLocation.assign.bind(_realLocation);
    var _origReplace = _realLocation.replace.bind(_realLocation);

    // Wrap location methods to block sitelock
    function isSitelock(url) {
        return url && url.toString().indexOf('sitelock') !== -1;
    }

    // Extract game domain from pathname (e.g., "uuid.poki-gdn.com")
    var pathMatch = location.pathname.match(/^\/proxy\/([^\/]+\.poki-gdn\.com)/);
    var gameDomain = pathMatch ? pathMatch[1] : null;
    var fakeOrigin = gameDomain ? 'https://' + gameDomain : null;
    var fakePath = gameDomain ? (location.pathname.replace('/proxy/' + gameDomain, '') || '/') : null;

    // Create fake location object
    var fakeLocation = {
        get hostname() { return gameDomain || _realLocation.hostname; },
        get host() { return gameDomain || _realLocation.host; },
        get origin() { return fakeOrigin || _realLocation.origin; },
        get href() { return fakeOrigin ? fakeOrigin + fakePath + _realLocation.search + _realLocation.hash : _realLocation.href; },
        get pathname() { return fakePath || _realLocation.pathname; },
        get protocol() { return 'https:'; },
        get search() { return _realLocation.search; },
        get hash() { return _realLocation.hash; },
        get port() { return ''; },
        toString: function() { return this.href; },
        assign: function(url) {
            if (isSitelock(url)) { console.log('[Proxy] Blocked assign:', url); return; }
            _origAssign(url);
        },
        replace: function(url) {
            if (isSitelock(url)) { console.log('[Proxy] Blocked replace:', url); return; }
            _origReplace(url);
        },
        reload: function() { _realLocation.reload(); }
    };

    // Override window.location
    try {
        Object.defineProperty(window, 'location', {
            get: function() { return fakeLocation; },
            set: function(url) {
                if (isSitelock(url)) { return; }
                _realLocation.href = url;
            },
            configurable: true
        });
    } catch(e) { /* Expected on HTTPS - browsers block location override */ }

    // Override document.location
    try {
        Object.defineProperty(document, 'location', {
            get: function() { return fakeLocation; },
            set: function(url) {
                if (isSitelock(url)) { console.log('[Proxy] Blocked doc location set:', url); return; }
                _realLocation.href = url;
            },
            configurable: true
        });
    } catch(e) {}

    // Override document.referrer
    try {
        Object.defineProperty(document, 'referrer', {
            get: function() { return 'https://poki.com/'; },
            configurable: true
        });
    } catch(e) {}

    // Override document.URL (some games check this instead of location)
    try {
        Object.defineProperty(document, 'URL', {
            get: function() { return fakeOrigin ? fakeOrigin + fakePath + _realLocation.search + _realLocation.hash : _realLocation.href; },
            configurable: true
        });
    } catch(e) {}

    // Override document.domain
    try {
        Object.defineProperty(document, 'domain', {
            get: function() { return gameDomain || _realLocation.hostname; },
            set: function() {},
            configurable: true
        });
    } catch(e) {}

    // CRITICAL: Make window.top and window.self point to window
    // This prevents iframe/frame-buster detection
    try {
        Object.defineProperty(window, 'top', {
            get: function() { return window; },
            configurable: true
        });
    } catch(e) { /* Expected on HTTPS */ }

    try {
        Object.defineProperty(window, 'parent', {
            get: function() { return window; },
            configurable: true
        });
    } catch(e) {}

    try {
        Object.defineProperty(window, 'self', {
            get: function() { return window; },
            configurable: true
        });
    } catch(e) {}

    // Also override frames.length to return 0
    try {
        Object.defineProperty(window, 'frames', {
            get: function() { return { length: 0 }; },
            configurable: true
        });
    } catch(e) {}

    // Override frameElement to hide iframe detection
    try {
        Object.defineProperty(window, 'frameElement', {
            get: function() { return null; },
            configurable: true
        });
    } catch(e) {}

    // NUCLEAR: Block any navigation that tries to change top/parent location
    // This catches frame-busters even when window.top override fails on HTTPS
    if (window.navigation) {
        window.navigation.addEventListener('navigate', function(e) {
            // Block navigations triggered by frame-buster code
            if (e.destination && e.destination.url) {
                var destUrl = e.destination.url;
                // Allow same-origin navigations, block cross-origin frame-busting
                if (destUrl.indexOf(location.origin) === -1 && destUrl.indexOf('/proxy/') === -1) {
                    console.log('[Proxy] Blocked navigation:', destUrl);
                    e.preventDefault();
                }
            }
        });
    }

    // Block atob for sitelock-related base64 decoding
    var _origAtob = window.atob;
    window.atob = function(str) {
        var decoded = _origAtob(str);
        // If decoding reveals sitelock URL, return safe value
        if (decoded.indexOf('sitelock') !== -1) {
            console.log('[Proxy] Blocked atob sitelock:', decoded);
            return 'javascript:void(0)';
        }
        // If it's a domain check, make it always pass
        if (decoded === '.poki-gdn.com' || decoded === '.poki.com') {
            return '.';  // Any hostname contains a dot
        }
        return decoded;
    };

    // Intercept fetch and XHR to rewrite poki-gdn.com URLs
    var pokiGdnPattern = /^(https?:)?\/\/([a-f0-9\-]+\.poki-gdn\.com)/i;

    function rewritePokiUrl(url) {
        if (!url) return url;
        var urlStr = url.toString();
        var match = urlStr.match(pokiGdnPattern);
        if (match) {
            return urlStr.replace(pokiGdnPattern, '/proxy/$2');
        }
        return url;
    }

    // Block/mock external ad and analytics requests that cause hangs
    var blockPatterns = [
        /ppub_config/i,
        /latest\.json.*date=/i,
        /apstag/i,
        /amazon-adsystem/i,
        /pubads/i,
        /doubleclick/i,
        /googlesyndication/i,
        /googletagservices/i,
        /gpt\.js/i,
        /rum$/i,
        /poki\.io/i,
        /a\.poki\.com/i,
        /geo\.poki/i,
        /config\?src=/i,
        /aps_csm/i,
        /prebid/i,
        /ima3\.js/i
    ];

    function shouldBlock(url) {
        if (!url) return false;
        var urlStr = url.toString();
        for (var i = 0; i < blockPatterns.length; i++) {
            if (blockPatterns[i].test(urlStr)) return true;
        }
        return false;
    }

    // Override fetch to block ad/analytics requests and rewrite poki-gdn URLs
    var _origFetch = window.fetch;
    window.fetch = function(input, init) {
        var url = (typeof input === 'string') ? input : (input instanceof Request ? input.url : '');
        if (shouldBlock(url)) {
            console.log('[Proxy] Blocked fetch:', url);
            // Return empty successful response
            return Promise.resolve(new Response('{}', { status: 200, headers: { 'Content-Type': 'application/json' } }));
        }
        if (typeof input === 'string') {
            input = rewritePokiUrl(input);
        } else if (input instanceof Request) {
            var newUrl = rewritePokiUrl(input.url);
            if (newUrl !== input.url) {
                input = new Request(newUrl, input);
            }
        }
        return _origFetch.call(this, input, init);
    };

    // Override XHR to block ad/analytics and rewrite poki-gdn URLs
    var _origXhrOpen = XMLHttpRequest.prototype.open;
    var _origXhrSend = XMLHttpRequest.prototype.send;
    XMLHttpRequest.prototype.open = function(method, url, async, user, password) {
        this._url = url;
        this._blocked = shouldBlock(url);
        if (this._blocked) {
            console.log('[Proxy] Blocked XHR:', url);
        }
        url = rewritePokiUrl(url);
        return _origXhrOpen.call(this, method, url, async, user, password);
    };
    XMLHttpRequest.prototype.send = function(body) {
        if (this._blocked) {
            // Simulate successful empty response
            var self = this;
            Object.defineProperty(self, 'readyState', { value: 4, writable: false });
            Object.defineProperty(self, 'status', { value: 200, writable: false });
            Object.defineProperty(self, 'responseText', { value: '{}', writable: false });
            Object.defineProperty(self, 'response', { value: '{}', writable: false });
            setTimeout(function() {
                if (self.onreadystatechange) self.onreadystatechange();
                if (self.onload) self.onload();
            }, 0);
            return;
        }
        return _origXhrSend.call(this, body);
    };

    // NUCLEAR OPTION: Replace XMLHttpRequest constructor entirely
    // to force all sync requests to async
    var OriginalXHR = window.XMLHttpRequest;
    window.XMLHttpRequest = function() {
        var xhr = new OriginalXHR();
        var _open = xhr.open;
        var _isSync = false;

        xhr.open = function(method, url, async) {
            _isSync = (async === false);
            // Force async to avoid responseType errors
            return _open.call(this, method, url, true, arguments[3], arguments[4]);
        };

        // Override responseType to not throw
        var _responseType = '';
        Object.defineProperty(xhr, 'responseType', {
            get: function() { return _responseType; },
            set: function(val) {
                try {
                    _responseType = val;
                    Object.getOwnPropertyDescriptor(OriginalXHR.prototype, 'responseType').set.call(xhr, val);
                } catch(e) {
                    // Silently handle - workaround applied
                }
            }
        });

        return xhr;
    };
    window.XMLHttpRequest.prototype = OriginalXHR.prototype;
    window.XMLHttpRequest.DONE = OriginalXHR.DONE;
    window.XMLHttpRequest.HEADERS_RECEIVED = OriginalXHR.HEADERS_RECEIVED;
    window.XMLHttpRequest.LOADING = OriginalXHR.LOADING;
    window.XMLHttpRequest.OPENED = OriginalXHR.OPENED;
    window.XMLHttpRequest.UNSENT = OriginalXHR.UNSENT;

    // Block script loading for ad libraries
    var _origCreateElement = document.createElement;
    document.createElement = function(tagName) {
        var el = _origCreateElement.call(document, tagName);
        if (tagName.toLowerCase() === 'script') {
            var _origSetAttr = el.setAttribute;
            el.setAttribute = function(name, value) {
                if (name === 'src' && shouldBlock(value)) {
                    console.log('[Proxy] Blocked script:', value);
                    return; // Don't set src
                }
                return _origSetAttr.call(this, name, value);
            };
            Object.defineProperty(el, 'src', {
                set: function(value) {
                    if (shouldBlock(value)) {
                        console.log('[Proxy] Blocked script src:', value);
                        return;
                    }
                    _origSetAttr.call(el, 'src', value);
                },
                get: function() { return el.getAttribute('src'); }
            });
        }
        return el;
    };

    // Location spoofing active for: gameDomain
})();
</script>
