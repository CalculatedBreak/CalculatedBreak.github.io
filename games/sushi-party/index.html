	<!-- Remove old service worker and block re-registration -->
	<script>
		if ('serviceWorker' in navigator) {
			navigator.serviceWorker.getRegistrations().then(function (regs) {
				regs.forEach(function (r) { r.unregister(); });
			});
			navigator.serviceWorker.register = function () { return Promise.resolve(); };
		}
	</script>

	<!-- PokiSDK stub: any missing method becomes a no-op. Must load BEFORE l.js -->
	<script>
		(function () {
			var noop = function () {};
			var base = {
				init: function () { return Promise.resolve(); },
				initWithVideoHB: function () { return Promise.resolve(); },
				isAdBlocked: function () { return false; },
				getURLParam: function () { return null; },
				shareableURL: function () { return Promise.resolve(''); },
				commercialBreak: function () { return Promise.resolve(); },
				rewardedBreak: function () { return Promise.resolve(true); }
			};
			window.PokiSDK = new Proxy(base, {
				get: function (target, prop) {
					if (prop in target) return target[prop];
					if (prop === 'then') return undefined;
					return noop;
				}
			});
		})();
	</script>
