<style>
  :root{
    --pz-bg:#161616;
    --pz-panel:#1f1f1f;
    --pz-text:#fff;
    --pz-muted:#a7a7a7;
    --pz-line:rgba(255,255,255,.10);
    --pz-accent:#f0d210;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--pz-bg);
    color:var(--pz-text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    text-align:center;
    overflow-x:hidden;
  }
  /* soft warm glow behind the card, painted with a gradient so it costs no request */
  body::before{
    content:"";
    position:fixed;
    left:50%;
    top:42%;
    width:min(760px,150vw);
    aspect-ratio:1/1;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(240,210,16,.09) 0%,rgba(240,210,16,0) 62%);
    pointer-events:none;
  }
  .card{
    position:relative;
    width:min(100%,440px);
    background:var(--pz-panel);
    border:1px solid var(--pz-line);
    border-radius:16px;
    padding:clamp(18px,5vmin,32px) clamp(16px,5vmin,30px);
    box-shadow:0 10px 40px rgba(0,0,0,.45);
  }
  .logo{
    display:block;
    width:clamp(46px,13vmin,68px);
    height:auto;
    margin:0 auto clamp(8px,2.4vmin,14px);
  }
  h1{
    margin:0 0 8px;
    font-size:clamp(17px,4.6vmin,23px);
    font-weight:700;
    line-height:1.25;
    letter-spacing:.2px;
  }
  p{
    margin:0 auto;
    max-width:34ch;
    color:var(--pz-muted);
    font-size:clamp(12px,3.1vmin,14px);
    line-height:1.5;
  }
  .btn{
    display:block;
    margin:clamp(14px,4vmin,22px) auto 0;
    padding:13px 26px;
    border-radius:999px;
    background:var(--pz-accent);
    color:#1b1b1b;
    font-size:clamp(14px,3.6vmin,17px);
    font-weight:700;
    letter-spacing:.2px;
    text-decoration:none;
    transition:transform .15s ease,filter .15s ease;
  }
  .btn:hover,.btn:focus-visible{filter:brightness(1.08);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .sub{
    margin:10px auto 0;
    font-size:clamp(10px,2.6vmin,12px);
    color:#7d7d7d;
  }
  /* very small embed frames: drop the card chrome, keep the message and button */
  @media (max-height:260px),(max-width:300px){
    body{padding:8px}
    .card{background:transparent;border:0;box-shadow:none;padding:6px}
    .logo{width:clamp(32px,11vmin,44px);margin-bottom:6px}
    .sub{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .btn{transition:none}
  }
</style>
</head>
