<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

  <link rel="stylesheet" href="common.css">

  <style>

  </style>

</head>

<body onload="myOnLoad()" id="body">

  <script src="common.js"></script>

  <script>
    var typeNames = ["normal", "physics"];
    var colliderNames = ["none", "box", "sphere"];

    var minWidth = 280;
    var maxWidth = 450;
    var sizeLimit18 = 450;
    var sizeLimit16 = 400;
    var sizeLimit14 = 350;
    var widthFraction = 0.6;
    var sizeLimit8Inv = 320;

    function setCollider(c, post) {
      return setValue(c, post, 'collider', colliderNames, 'prefab');
      // webViewLog("webview html setCollider() called " + c);
    }
    function setType(c, post) {
      return setValue(c, post, 'type', typeNames, 'prefab');
      // webViewLog("webview html setType() called " + c);
    }

    function myOnLoad() {
      var content = document.getElementById('content');
      content.innerHTML =
        getToggleButtonsHtml({
          topClass: 'centered',
          header: 'Collider',
          buttons: colliderNames.map(function (cn, i) {
            return {
              prefix: 'collider',
              caption: capitalizeFirstLetter(cn),
              onClick: 'return setCollider(' + i + ', true)',
            };
          }),
        }) +
        getToggleButtonsHtml({
          topClass: 'centered island',
          header: 'Type',
          buttons: typeNames.map(function (tn, i) {
            return {
              prefix: 'type',
              caption: capitalizeFirstLetter(tn),
              onClick: 'return setType(' + i + ', true)',
            };
          }),
        }) +
        getActionButtonsHtml([{caption: 'OK', onClick: 'return webViewClose()', selected: true}]);

      onLoad();
    }

  </script>

  <div id="content">
  </div>
</body>

</html>
