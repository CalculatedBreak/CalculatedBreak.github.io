<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

  <link rel="stylesheet" href="common.css">

  <style>
    #message {
      font-family: 'Baloo 2', 'Ubuntu', verdana, sans-serif;
      text-align: left;
      padding: 0.5em;
      color: #adbdd1;
      line-height: 110%;
    }
  </style>

</head>

<body onload="myOnLoad()" id="body" >
  <script src="common.js"></script>
  <script>
    var minWidth = 280;
    var maxWidth = 485;
    var sizeLimit18 = 450;
    var sizeLimit16 = 400;
    var sizeLimit14 = 350;
    var sizeLimit8Inv = 320;
    var widthFraction = 0.85;
  
    function setHeader(text) {
      var h = document.getElementById('header');
      h.innerHTML = text;
    }
    function setMessage(text) {
      var m = document.getElementById('message');
      m.innerHTML = text;
    }
    function setCancelText(text) {
      var h = document.getElementById('btncancel');
      h.innerHTML = text;
    }
    function setOkText(text) {
      var h = document.getElementById('btnok');
      h.innerHTML = text;
    }
  
    function myOnLoad() {
      var content = document.getElementById('bordered');
      content.innerHTML +=
        getActionButtonsHtml(
          [
            {caption: 'Cancel', onClick: 'return webViewCancel()', id: 'btncancel'},
            {caption: 'OK', onClick: 'return webViewOk()', selected: true, id: 'btnok'}, 
          ],
          true);
      onLoad();
    }
  </script>

  <div class="centered" id="content">
    <div class="backdrop rounded-outer">
      <div class="border black rounded-middle" id="bordered">
        <div class="topmost headerface rounded-inner">
          <div id="header">Header text</div>
        </div>
        <div class="messageface">
          <div id="message">Message Text</div>
        </div>
        <!-- Content appended here on load -->
      </div>
    </div>
  </div>
</body>

</html>
