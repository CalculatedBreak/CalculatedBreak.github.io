<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

  <link rel="stylesheet" href="common.css">

  <style>
    #forgot {
      color: white;
      opacity: 50%;
    }
  </style>

</head>

<body onload="myOnLoad()" id="body" >
  <script src="common.js"></script>
  <script>
    var minWidth = 280;
    var maxWidth = 485;
    var sizeLimit18 = 450;
    var sizeLimit16 = 400;
    var sizeLimit14 = 350;
    var sizeLimit8Inv = 320;
    var widthFraction = 0.85;

    function myOnLoad() {
      var content = document.getElementById('bordered');
      content.innerHTML +=
        getActionButtonsHtml(
          [
            {caption: 'Cancel', onClick: 'return webViewCancel()', id: "btncancel"},
            {caption: 'Sign In', onClick: 'return attemptSignIn()', selected: true, id: "btnok"}, 
          ],
          true);
      onLoad();
      addElementEnterKeyAction('pwd', attemptSignIn);
    }

    function attemptSignIn() {
      var e = document.getElementById("email");
      var p = document.getElementById("pwd");
      webViewPostMessage('attempt_signin|' + e.value + '|' + p.value);
      return webViewClose();
    }

    function sendResetEmail() {
      var e = document.getElementById("email");
      var emsg = document.getElementById("error_message");
      emsg.innerHTML = "";
      if (e.value == "") {
        emsg.innerHTML = "Enter email";
        return;
      }
      webViewPostMessage('forgot_password|' + e.value);
      return webViewCancel();
    }
  </script>

  <div class="centered" id="content">
    <div class="backdrop rounded-outer">
      <div class="border black rounded-middle" id="bordered">
        <div class="topmost headerface rounded-inner">
          Welcome back!
          <br/><a id="error_message"></a>
        </div>
        <div class="vertical">
          <input class="inputfield" type="email" id="email" placeholder="email"/>
          <input class="inputfield" type="password" id="pwd" placeholder="password" autocomplete="current-password"/>
        </div>
        <!-- Content appended here on load -->
      </div>
    </div>
    <br/><a id="forgot" onclick="return sendResetEmail()" style="opacity: 100%;" class="hyperlink">(forgot password?)</a>
  </div>
</body>

</html>
