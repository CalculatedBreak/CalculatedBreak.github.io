<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

  <link rel="stylesheet" href="common.css">

  <style>
    #btnok {
      background-color: #ff4967;
    }
    #btnok > .buttonface {
      background-color: #ff4967;
      color: white;
    }
    #message {
      font-family: 'Baloo 2', 'Ubuntu', verdana, sans-serif;
      text-align: left;
      padding: 0.5em;
      color: #adbdd1;
      line-height: 110%;
    }
  </style>

</head>

<body onload="myOnLoad()" id="body" >
  <script src="common.js"></script>
  <script>
    var minWidth = 280;
    var maxWidth = 450;
    var sizeLimit18 = 450;
    var sizeLimit16 = 400;
    var sizeLimit14 = 350;
    var sizeLimit8Inv = 320;
    var widthFraction = 0.85;

    function myOnLoad() {
      var content = document.getElementById('bordered');
      content.innerHTML +=
        getActionButtonsHtml(
          [
            {caption: 'Cancel', onClick: 'return webViewClose()', selected: true},
            {caption: 'Delete', onClick: 'return attemptDeletion()', id:'btnok'},
          ],
          true);
      onLoad();
    }

    function attemptDeletion() {
      var e = document.getElementById("email");
      var p = document.getElementById("pwd");
      webViewPostMessage('attempt_deletion|' + e.value + '|' + p.value);
      return webViewClose();
    }
  </script>

  <div class="centered" id="content">
    <div class="backdrop rounded-outer">
      <div class="border black rounded-middle" id="bordered">
        <div class="topmost headerface rounded-inner">
          Delete User Account
        </div>
        <div class="vertical">
          <div class="messageface">
            <div id="message">You will lose any gems, nickname, and saved progress linked to the account. This operation can not be undone. Are you sure?</div>
          </div>
          <input class="inputfield" type="email" id="email" placeholder="e-mail"/>
          <input class="inputfield" type="password" id="pwd" placeholder="password" autocomplete="current-password"/>
        </div>
        <!-- content appended here on load -->
      </div>
    </div>
  </div>
</body>

</html>
