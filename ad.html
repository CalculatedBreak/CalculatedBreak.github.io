<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continue to Edusphere Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="theme.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4353830713556880"
     crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--body);
    }

    .container {
      width: min(90%, 400px);
      padding: 32px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 8px 26px rgba(36, 53, 47, .08);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
      font-family: var(--display);
    }

    p {
      color: var(--muted);
      line-height: 1.5;
    }

    .theme-toggle {
      display: block;
      width: auto;
      margin: 0 0 18px auto;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px 20px;
      border: 1px solid var(--accent);
      border-radius: 7px;
      font: 700 16px var(--body);
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    #watch-ad-btn {
      background: var(--accent);
      color: #fffefa;
    }

    #watch-ad-btn:hover {
      background: var(--accent-strong);
    }

    #continue-btn {
      background: var(--surface-raised);
      color: var(--text);
      border-color: var(--line);
    }

    #continue-btn:hover {
      background: var(--line);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      min-height: 24px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 14px;
    }

    #applixir-ad-container {
      width: 100%;
    }
  </style>


  <!-- Google Analytics Tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FV0H0442XN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-FV0H0442XN');
  </script>
</head>

<body>
  <main class="container">
    <button class="theme-toggle" type="button" data-theme-toggle>Dark mode</button>
    <h1>Ready to Continue?</h1>

<p>
  Watch an ad to continue, or skip it and go straight to your dashboard.
</p>

<div id="applixir-ad-container"></div>

<button id="watch-ad-btn" type="button">
  Watch Ad
</button>

<button id="continue-btn" type="button">
  Continue Without Ad
</button>

<div id="status" role="status" aria-live="polite"></div>

  </main>

  <script src="https://cdn.applixir.com/applixir.app.v6.1.0.js"></script>

  <script>
    (function () {
      "use strict";

      const watchButton = document.getElementById("watch-ad-btn");
      const continueButton = document.getElementById("continue-btn");
      const status = document.getElementById("status");

      let adStarted = false;
      let redirected = false;

      function goToDashboard() {
        if (redirected) return;

        redirected = true;
        window.location.href = "menu.html";
      }

      const options = {
        apiKey: "5a4db0c5-0000-4000-8000-5a4db0c50001",
        injectionElementId: "applixir-ad-container",

        adStatusCallbackFn: function (adStatus) {
          console.log("Applixir status:", adStatus);

          if (adStatus && adStatus.type === "complete") {
            status.textContent = "Ad completed! Redirecting...";
            goToDashboard();
          }
        },

        adErrorCallbackFn: function (error) {
          console.error("Applixir ad error:", error);

          adStarted = false;
          watchButton.disabled = false;
          watchButton.textContent = "Try Again";

          status.textContent =
            "The ad could not be loaded. You can try again or continue without an ad.";
        }
      };

      watchButton.addEventListener("click", function () {
        if (adStarted || redirected) return;

        if (typeof window.initializeAndOpenPlayer !== "function") {
          status.textContent =
            "The ad service is unavailable. You can continue without an ad.";
          return;
        }

        adStarted = true;
        watchButton.disabled = true;
        watchButton.textContent = "Loading Ad...";

        status.textContent = "Loading advertisement...";

        try {
          window.initializeAndOpenPlayer(options);
        } catch (error) {
          console.error("Failed to start Applixir:", error);

          adStarted = false;
          watchButton.disabled = false;
          watchButton.textContent = "Try Again";

          status.textContent =
            "Unable to start the ad. You can continue without an ad.";
        }
      });

      continueButton.addEventListener("click", goToDashboard);
    })();
  </script>

</body>
</html>
