<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continue to Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(90%, 400px);
      padding: 32px;
      text-align: center;
      background: #171717;
      border: 1px solid #303030;
      border-radius: 16px;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      color: #b3b3b3;
      line-height: 1.5;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px 20px;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    #watch-ad-btn {
      background: #6366f1;
      color: #fff;
    }

    #watch-ad-btn:hover {
      background: #4f46e5;
    }

    #continue-btn {
      background: #292929;
      color: #fff;
      border: 1px solid #404040;
    }

    #continue-btn:hover {
      background: #383838;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      min-height: 24px;
      margin-top: 16px;
      color: #b3b3b3;
      font-size: 14px;
    }

    #applixir-ad-container {
      width: 100%;
    }
  </style>

</head>

<body>
  <main class="container">
    <h1>Ready to Continue?</h1>

```
<p>
  Watch an ad to continue, or skip it and go straight to your dashboard.
</p>

<div id="applixir-ad-container"></div>

<button id="watch-ad-btn" type="button">
  Watch Ad
</button>

<button id="continue-btn" type="button">
  Continue Without Ad
</button>

<div id="status" role="status" aria-live="polite"></div>
```

  </main>

  <script src="https://cdn.applixir.com/applixir.app.v6.1.0.js"></script>

  <script>
    (function () {
      "use strict";

      const watchButton = document.getElementById("watch-ad-btn");
      const continueButton = document.getElementById("continue-btn");
      const status = document.getElementById("status");

      let adStarted = false;
      let redirected = false;

      function goToDashboard() {
        if (redirected) return;

        redirected = true;
        window.location.href = "dashboard.html";
      }

      const options = {
        apiKey: "5a4db0c5-0000-4000-8000-5a4db0c50001",
        injectionElementId: "applixir-ad-container",

        adStatusCallbackFn: function (adStatus) {
          console.log("Applixir status:", adStatus);

          if (adStatus && adStatus.type === "complete") {
            status.textContent = "Ad completed! Redirecting...";
            goToDashboard();
          }
        },

        adErrorCallbackFn: function (error) {
          console.error("Applixir ad error:", error);

          adStarted = false;
          watchButton.disabled = false;
          watchButton.textContent = "Try Again";

          status.textContent =
            "The ad could not be loaded. You can try again or continue without an ad.";
        }
      };

      watchButton.addEventListener("click", function () {
        if (adStarted || redirected) return;

        if (typeof window.initializeAndOpenPlayer !== "function") {
          status.textContent =
            "The ad service is unavailable. You can continue without an ad.";
          return;
        }

        adStarted = true;
        watchButton.disabled = true;
        watchButton.textContent = "Loading Ad...";

        status.textContent = "Loading advertisement...";

        try {
          window.initializeAndOpenPlayer(options);
        } catch (error) {
          console.error("Failed to start Applixir:", error);

          adStarted = false;
          watchButton.disabled = false;
          watchButton.textContent = "Try Again";

          status.textContent =
            "Unable to start the ad. You can continue without an ad.";
        }
      });

      continueButton.addEventListener("click", goToDashboard);
    })();
  </script>

</body>
</html>
