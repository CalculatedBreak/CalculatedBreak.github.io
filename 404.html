<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="description" content="Page not found on EduSphere Game Hub.">
  <title>Page not found | EduSphere</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FV0H0442XN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FV0H0442XN');
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #170f35;
      --bg-deep: #0f0925;
      --panel: #241a4d;
      --panel-hi: #2f2266;
      --line: #4636a0;
      --text: #f4f0ff;
      --muted: #b3a8e6;
      --pink: #ff4f9a;
      --cyan: #3de0ff;
      --sun: #ffd23f;
      --radius: 18px;
      --display: "Bungee", "Impact", sans-serif;
      --body: "Space Grotesk", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--body);
      color: var(--text);
      background:
        radial-gradient(900px 500px at 85% -10%, rgba(255,79,154,.25), transparent 60%),
        radial-gradient(700px 500px at -5% 105%, rgba(61,224,255,.18), transparent 60%),
        var(--bg-deep);
      background-attachment: fixed;
      line-height: 1.55;
    }

    a { color: var(--cyan); }
    :focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
    [hidden] { display: none !important; }

    .page {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px clamp(16px, 4vw, 32px) 48px;
    }

    /* ---- Top bar ---- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text);
      text-decoration: none;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      font-family: var(--display);
      font-size: 1.1rem;
      color: var(--bg-deep);
      background: var(--sun);
      border-radius: 12px;
      box-shadow: 4px 4px 0 var(--pink);
      transform: rotate(-6deg);
    }
    .brand-text {
      font-family: var(--display);
      font-size: 1.3rem;
      letter-spacing: .02em;
    }

    /* ---- Buttons ---- */
    .btn {
      display: inline-block;
      padding: 12px 22px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font: 700 1rem var(--body);
      text-align: center;
      text-decoration: none;
      color: var(--bg-deep);
      background: var(--sun);
      box-shadow: 0 5px 0 #c99a00;
      transition: transform .1s, box-shadow .1s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #c99a00; }
    .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #c99a00; }
    .btn--alt { background: var(--cyan); box-shadow: 0 5px 0 #1f9fb8; }
    .btn--alt:hover { box-shadow: 0 7px 0 #1f9fb8; }
    .btn--alt:active { box-shadow: 0 1px 0 #1f9fb8; }

    /* ---- Hero ---- */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: clamp(32px, 8vw, 72px) 0 40px;
    }
    .eyebrow { margin: 0 0 4px; color: var(--muted); font-size: .9rem; }

    .error-code {
      position: relative;
      margin: 0;
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(6rem, 24vw, 13rem);
      line-height: 1;
      letter-spacing: .02em;
      color: var(--sun);
      text-shadow: 6px 6px 0 var(--pink), 12px 12px 0 rgba(61,224,255,.35);
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-1.5deg); }
      50% { transform: translateY(-10px) rotate(1.5deg); }
    }

    .error-title {
      margin: 18px 0 8px;
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      line-height: 1.15;
    }
    .error-text { margin: 0 0 28px; max-width: 46ch; color: var(--muted); font-size: 1.05rem; }
    .error-path {
      display: inline-block;
      max-width: 100%;
      margin: 0 0 28px;
      padding: 6px 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      border: 2px dashed var(--line);
      border-radius: 999px;
      color: var(--cyan);
      font-size: .9rem;
      background: var(--panel);
    }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }

    /* ---- Suggested games ---- */
    .more-games { margin-top: 24px; }
    .more-games h2 {
      margin: 0 0 4px;
      font-family: var(--display);
      font-weight: 400;
      font-size: 1.8rem;
    }
    .section-lead { margin: 0 0 20px; color: var(--muted); }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 18px;
    }
    .game-card {
      --accent: var(--cyan);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: var(--text);
      text-decoration: none;
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 6px 6px 0 var(--accent);
      transition: transform .15s, box-shadow .15s;
    }
    .game-card:hover { transform: translate(-3px,-3px); box-shadow: 9px 9px 0 var(--accent); }
    .game-card:active { transform: translate(3px,3px); box-shadow: 2px 2px 0 var(--accent); }
    .game-card:nth-child(4n+1) { --accent: var(--cyan); }
    .game-card:nth-child(4n+2) { --accent: var(--pink); }
    .game-card:nth-child(4n+3) { --accent: var(--sun); }
    .game-card:nth-child(4n+4) { --accent: #5dffa6; }

    .game-card-thumb {
      height: 120px;
      overflow: hidden;
      background: var(--panel-hi);
      border-bottom: 2px solid var(--line);
    }
    .game-card-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .game-card-body { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 14px; }
    .game-card-tag {
      align-self: flex-start;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: .78rem;
      font-weight: 700;
      color: var(--bg-deep);
      background: var(--accent);
      text-transform: capitalize;
    }
    .game-card-name {
      margin: 0;
      font-family: var(--display);
      font-weight: 400;
      font-size: 1rem;
      line-height: 1.2;
    }

    .footer {
      margin-top: 56px;
      padding-top: 20px;
      border-top: 2px dashed var(--line);
      color: var(--muted);
      font-size: .9rem;
    }

    @media (max-width: 560px) {
      .brand-text { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

<body>
  <div class="page">

    <div class="topbar">
      <a href="/index.html" class="brand">
        <span class="brand-mark" aria-hidden="true">ES</span>
        <span class="brand-text">EduSphere</span>
      </a>
      <a href="/menu.html" class="btn btn--alt">All games</a>
    </div>

    <main class="hero">
      <p class="eyebrow">Oops, wrong level</p>
      <h1 class="error-code" aria-label="Error 404">404</h1>
      <h2 class="error-title">Page not found</h2>
      <p class="error-text">
        That page doesn't exist or has moved. Head back to the Game Hub and pick something to play.
      </p>
      <p class="error-path" id="error-path" hidden></p>
      <div class="actions">
        <a href="/menu.html" class="btn">Back to Game Hub</a>
        <a href="/index.html" class="btn btn--alt">Home</a>
      </div>
    </main>

    <!-- Suggestions (filled from script.js; hidden if it can't load) -->
    <section class="more-games" id="more-games" hidden>
      <h2>Try one of these</h2>
      <p class="section-lead">A few games while you're here.</p>
      <div class="game-grid" id="game-grid"></div>
    </section>

    <footer class="footer">
      <p>Need help? Email <a href="mailto:labsupport@edusphere.edu">labsupport@edusphere.edu</a></p>
    </footer>

  </div>

  <!-- Provides GAME_MODULES and getGameId() (the same file the hub and player use) -->
  <script src="/script.js"></script>

  <script>
    // Show which address was missing.
    (function () {
      var el = document.getElementById("error-path");
      var path = location.pathname + location.search;
      if (el && path && path !== "/") {
        el.textContent = path;
        el.hidden = false;
      }
    })();

    // Suggest a few random games, same cards as the player page.
    (function () {
      try {
        if (typeof GAME_MODULES === "undefined" || typeof getGameId !== "function") return;

        var catalog = GAME_MODULES.map(function (m) {
          var id = getGameId(m.href);
          if (!id) return null;
          var thumb = /^(https?:)?\/\//.test(m.img) || m.img.charAt(0) === "/" ? m.img : "/" + m.img;
          return { id: id, title: m.title, thumb: thumb, cat: m.cat || "game" };
        }).filter(Boolean);

        if (!catalog.length) return;

        // shuffle, then take 8
        for (var i = catalog.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = catalog[i]; catalog[i] = catalog[j]; catalog[j] = tmp;
        }
        var picks = catalog.slice(0, 8);

        var grid = document.getElementById("game-grid");
        picks.forEach(function (game) {
          var link = document.createElement("a");
          link.className = "game-card";
          link.href = "/player.html?" + new URLSearchParams({ game: game.id, title: game.title }).toString();

          var thumbWrap = document.createElement("div");
          thumbWrap.className = "game-card-thumb";
          var img = document.createElement("img");
          img.src = game.thumb;
          img.alt = game.title;
          img.loading = "lazy";
          img.onerror = function () { img.remove(); };
          thumbWrap.appendChild(img);

          var body = document.createElement("div");
          body.className = "game-card-body";
          var tag = document.createElement("span");
          tag.className = "game-card-tag";
          tag.textContent = game.cat;
          var name = document.createElement("h3");
          name.className = "game-card-name";
          name.textContent = game.title;

          body.appendChild(tag);
          body.appendChild(name);
          link.appendChild(thumbWrap);
          link.appendChild(body);
          grid.appendChild(link);
        });

        document.getElementById("more-games").hidden = false;
      } catch (e) {
        // Suggestions are optional: the page works without them.
      }
    })();
  </script>
</body>
</html>
